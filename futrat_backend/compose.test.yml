services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: futrat_upgrade_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d futrat_upgrade_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      target: test
    environment:
      FUTRAT_TEST_DATABASE_URL: postgresql+psycopg2://test:test@db:5432/futrat_upgrade_test
    depends_on:
      db:
        condition: service_healthy
